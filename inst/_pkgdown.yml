url: https://calcofi.io/calcofi4db
template:
  bootstrap: 5
  light-switch: true
  # the dark half of the brand (https://calcofi.io/brand/v2/theme.css, :root[data-theme="dark"]):
  # navy, not Bootstrap's near-black; the light half stays Bootstrap's own white
  bslib:
    body-bg-dark:             "#0f1a2e"
    body-color-dark:          "#e9edf3"
    body-emphasis-color-dark: "#ffffff"
    body-secondary-bg-dark:   "#182b49"
    body-tertiary-bg-dark:    "#21375c"
    border-color-dark:        "#34486b"
    link-color-dark:          "#4fb6e6"
    link-hover-color-dark:    "#8ad0f0"
    navbar-dark-bg:           "#182b49"
  includes:
    # the "CalCOFI.io" lockup far left -> calcofi.io, then pkgdown's own brand (the package
    # name -> this site) and version beside it: the brand contract's lockup + title, in the
    # slot pkgdown's navbar template leaves before the title
    before_title: |
      <a class="cc-home" href="https://calcofi.io" aria-label="CalCOFI.io home"><img class="cc-logo-dark" src="https://calcofi.io/brand/v2/logo_calcofi_h.svg" alt="CalCOFI.io"><img class="cc-logo-light" src="https://calcofi.io/brand/v2/logo_calcofi_h_light.svg" alt="CalCOFI.io"></a>
    in_header: |
      <!-- calcofi.io brand contract v2 (https://calcofi.io/brand/v2/; light default,
           in force 2026-09-04): pkgdown's own light-switch stays as the toggle (its
           key is localStorage.theme); the pre-paint below also writes that key so
           the switch and the cross-site cookie agree, and the observer pushes a
           switch click back into the cookie. calcofi4db has no mark of its own,
           so the favicon is the shared CalCOFI set, linked here because pkgdown
           only emits favicons from pkgdown/favicon/ (deliberately absent). -->
      <link rel="icon" type="image/x-icon" href="https://calcofi.io/brand/v2/favicon.ico">
      <link rel="icon" type="image/png" sizes="32x32" href="https://calcofi.io/brand/v2/favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="https://calcofi.io/brand/v2/favicon-16x16.png">
      <link rel="apple-touch-icon" sizes="180x180" href="https://calcofi.io/brand/v2/apple-touch-icon.png">
      <script>(function(){var d=document.documentElement,m=/[?&]theme=(dark|light)\b/.exec(location.search),k=/(?:^|;\s*)cc_theme_src=user\b/.test(document.cookie),c=k&&/(?:^|;\s*)cc_theme=(dark|light)\b/.exec(document.cookie),s=null;try{if(localStorage.getItem("cc_theme_src")==="user")s=localStorage.getItem("cc_theme")}catch(e){}var t=(m&&m[1])||(c&&c[1])||(s==="dark"||s==="light"?s:null)||"light";d.dataset.theme=t;d.setAttribute("data-bs-theme",t);d.style.colorScheme=t;try{localStorage.setItem("theme",t)}catch(e){}})();</script>
      <link rel="preload" href="https://calcofi.io/brand/v2/fonts/SourceSans3-VF.woff2" as="font" type="font/woff2" crossorigin>
      <link rel="stylesheet" href="https://calcofi.io/brand/v2/fonts.css">
      <link rel="stylesheet" href="https://calcofi.io/brand/v2/theme.css">
      <script defer src="https://calcofi.io/brand/v2/theme.js"></script>
      <script>(function(){var r=document.documentElement,last=r.getAttribute("data-bs-theme");new MutationObserver(function(){var t=r.getAttribute("data-bs-theme");if(t===last||(t!=="dark"&&t!=="light"))return;last=t;if(window.ccTheme&&ccTheme.get()!==t)ccTheme.set(t)}).observe(r,{attributes:true,attributeFilter:["data-bs-theme"]})})();</script>
      <style>
        /* the lockup (before_title) at the app header's 28 px; the ground it shows is pkgdown's data-bs-theme */
        .navbar .cc-home{display:inline-flex;align-items:center;margin-right:.75rem;text-decoration:none}
        .navbar .cc-home img{height:28px;width:auto}
        .navbar .cc-home .cc-logo-dark,.navbar .cc-home .cc-logo-light{display:none}
        [data-bs-theme=dark] .navbar .cc-home .cc-logo-dark,[data-bs-theme=light] .navbar .cc-home .cc-logo-light{display:block}
        /* the bar spans the window, as every calcofi.io header does: the lockup at the left edge, the
           links at the right, instead of both squeezed into the 1320 px content column; the page
           below keeps pkgdown's centred column. From 1200 px the nav labels stay on one line ("Get
           started"); between the collapse (992 px) and 1200 px they may wrap, and the search narrows. */
        .navbar>.container{max-width:none;padding-left:1.25rem;padding-right:1.25rem}
        @media (min-width:1200px){.navbar .nav-link{white-space:nowrap}}
        @media (min-width:992px) and (max-width:1199.98px){.navbar input[type=search]{width:6rem}.navbar .navbar-nav .nav-link{padding-left:.35rem;padding-right:.35rem}}
        /* the light-switch button wears the brand pair (theme.css exports the masks): the sun while
           the page is dark, the moon-in-sun while it is light — what a click moves toward, as on
           calcofi4py — in place of Font Awesome's current-mode sun/moon. The menu's own
           Light / Dark / Auto icons stay. */
        #dropdown-lightswitch .fa::before{content:"" !important;display:inline-block;width:1.15rem;height:1.15rem;vertical-align:-.25em;background-color:currentColor;-webkit-mask:var(--cc-icon-moon) center/contain no-repeat;mask:var(--cc-icon-moon) center/contain no-repeat}
        [data-bs-theme=dark] #dropdown-lightswitch .fa::before{-webkit-mask-image:var(--cc-icon-sun);mask-image:var(--cc-icon-sun)}
      </style>
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-0HVK8TDMCF"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        // content_group is what the usage report at calcofi.io/analytics/ joins on
        // navigator.webdriver is set in every WebDriver/CDP-controlled browser, so
        // Playwright, Puppeteer and our own shot-scraper screenshots stop counting.
        // GA4's bot list is user-agent based and never sees them.
        if (!navigator.webdriver) gtag('config', 'G-0HVK8TDMCF', { content_group: 'calcofi4db' });
      </script>
navbar:
  structure:
    # no intro / articles: the package has no vignettes
    left:  [reference, news]
    right: [schema, query, docs, search, lightswitch, github]
  components:
    schema:
      text: Schema
      href: https://calcofi.io/db-schema/
      aria-label: CalCOFI Schema explorer (ERD, tables, columns, units)
    query:
      text: Query
      href: https://calcofi.io/db-query/
      aria-label: CalCOFI Query (browser DuckDB-WASM)
    docs:
      text: Docs
      href: https://calcofi.io/docs/
      aria-label: CalCOFI Docs
reference:
- title: "Cloud Storage (GCS)"
  desc: functions for Google Cloud Storage operations
  contents:
  - has_concept("cloud")
- title: "Parquet"
  desc: functions for Apache Parquet file operations
  contents:
  - has_concept("parquet")
- title: "DuckDB"
  desc: basic DuckDB database operations
  contents:
  - has_concept("duckdb")
- title: "Working DuckLake"
  desc: functions for the internal Working DuckLake with provenance tracking
  contents:
  - has_concept("ducklake")
- title: "Frozen Releases"
  desc: functions for creating and managing frozen DuckLake releases
  contents:
  - has_concept("freeze")
- title: "Read"
  desc: functions reading data, particularly from CSV files in the Google Drive CalCOFI data folder
  contents:
  - has_concept("read")
- title: "Transform"
  desc: functions to transform data, after reading data and before ingesting into the database
  contents:
  - has_concept("transform")
- title: "Check"
  desc: functions for data validation and integrity checking
  contents:
  - has_concept("check")
- title: "Validate"
  desc: functions for referential integrity validation and flagging invalid rows
  contents:
  - has_concept("validate")
- title: "Ingest"
  desc: functions for ingesting data into the database (PostgreSQL deprecated, use DuckLake)
  contents:
  - has_concept("ingest")
- title: "Version"
  desc: functions for schema and package versioning
  contents:
  - has_concept("version")
- title: "Utilities"
  desc: utility functions for database operations (PostgreSQL deprecated)
  contents:
  - has_concept("utils")
- title: "Wrangle"
  desc: functions for local DuckDB wrangling (keys, IDs, table consolidation)
  contents:
  - has_concept("wrangle")
- title: "Workflow"
  desc: functions for orchestrating ingestion workflow steps
  contents:
  - has_concept("workflow")
- title: "Display"
  desc: helper functions for workflow display outputs (GitHub links, validation tables)
  contents:
  - has_concept("display")
- title: "Archive"
  desc: functions for archiving and managing historical data snapshots
  contents:
  - has_concept("archive")
- title: "Version Sync"
  desc: functions for synchronizing schema and package versions
  contents:
  - has_concept("version_sync")
- title: "Visualize"
  desc: functions visualizing diagnostic outputs, particularly color coded data tables
  contents:
  - has_concept("viz")
- title: "Other"
  desc: check for other functions or datasets not captured by above categories
  contents:
  - lacks_concepts(c("cloud", "parquet", "duckdb", "ducklake", "freeze", "read", "transform", "check", "validate", "wrangle", "workflow", "display", "archive", "version_sync", "ingest", "version", "utils", "viz"))
